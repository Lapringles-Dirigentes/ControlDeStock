<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stock Pringles">
<meta name="theme-color" content="#2C4A3B">
<title>Stock La Pringles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  :root {
    --canvas: #F3EFE3;
    --canvas-dark: #E7E0CC;
    --ink: #23291F;
    --forest: #2C4A3B;
    --forest-light: #3E6350;
    --khaki: #A99A6B;
    --amber: #C97F2A;
    --amber-bg: #FBEBD6;
    --red: #A63B32;
    --red-bg: #F6DFDA;
    --green-ok: #4A7A5C;
    --green-bg: #E1EBDF;
    --blue: #3D6A8A;
    --blue-bg: #DEE9F0;
    --tab-shadow: rgba(35,41,31,0.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--canvas); color: var(--ink); font-family: 'Source Sans 3', sans-serif; -webkit-font-smoothing: antialiased; }
  body { background-image: radial-gradient(circle at 1px 1px, rgba(35,41,31,0.05) 1px, transparent 0); background-size: 18px 18px; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 60px; }

  /* Login gate */
  .login-screen { position: fixed; inset: 0; background: var(--forest); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box { max-width: 380px; width: 100%; text-align: center; }
  .login-box .eyebrow { color: var(--khaki); justify-content: center; display: flex; }
  .login-box h1 { color: var(--canvas); font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 26px; margin: 4px 0 6px; }
  .login-box .lead { color: rgba(243,239,227,0.65); font-size: 13.5px; margin: 0 0 22px; line-height: 1.5; }
  .login-box input { width: 100%; padding: 13px 14px; border-radius: 3px; border: 1.5px solid var(--khaki); font-size: 15px; text-align: center; }
  .login-box .btn-primary { width: 100%; margin-top: 12px; padding: 13px; }
  .login-error { color: #E9A79B; font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 14px; line-height: 1.5; display: none; }
  .login-error.show { display: block; }

  /* Hidden bottom permissions button */
  .perm-btn { position: fixed; bottom: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; background: rgba(35,41,31,0.12); color: rgba(35,41,31,0.35); font-size: 13px; display: flex; align-items: center; justify-content: center; z-index: 40; transition: opacity 0.2s; }
  .perm-btn:active { background: rgba(35,41,31,0.25); }

  /* Permission panel extras */
  .perm-user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--canvas-dark); gap: 8px; }
  .perm-user-info { font-size: 13px; }
  .perm-user-info .e { font-weight: 600; word-break: break-all; }
  .perm-user-info .r { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #766A4A; text-transform: uppercase; }
  .perm-user-controls { display: flex; gap: 6px; flex-shrink: 0; }
  .perm-mini-btn { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; padding: 6px 8px; border-radius: 3px; background: var(--canvas-dark); color: var(--forest); font-weight: 600; }
  .perm-mini-btn.del { color: var(--red); }
  .perm-locked { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #8B8064; }
  .session-bar { display: flex; justify-content: space-between; align-items: center; background: var(--canvas-dark); border-radius: 3px; padding: 10px 12px; margin-bottom: 16px; font-size: 12.5px; }
  .session-bar b { display: block; font-size: 13px; }
  button { font-family: 'Source Sans 3', sans-serif; cursor: pointer; border: none; background: none; }
  input, select, textarea { font-family: inherit; }

  header.top { padding: 18px 20px 0; border-bottom: 3px solid var(--forest); background: var(--forest); color: var(--canvas); position: sticky; top: 0; z-index: 20; }
  .header-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--khaki); margin: 0 0 4px; }
  h1.title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 0.01em; margin: 0; text-transform: uppercase; }
  .camp-btn { font-size: 22px; background: rgba(243,239,227,0.1); border: 1px solid rgba(243,239,227,0.3); border-radius: 6px; padding: 6px 10px; position: relative; }
  .camp-badge { position: absolute; top: -6px; right: -6px; background: var(--amber); color: var(--ink); font-size: 10px; font-weight: 700; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; }

  .tab-switch { display: flex; gap: 6px; margin-top: 16px; }
  .tab-btn { flex: 1; padding: 10px 0; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(243,239,227,0.55); border-bottom: 3px solid transparent; }
  .tab-btn.active { color: var(--canvas); border-bottom-color: var(--khaki); }

  .subtab-switch { display: flex; gap: 8px; margin: 14px 20px 0; }
  .subtab-btn { padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; background: var(--canvas-dark); color: #766A4A; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.04em; }
  .subtab-btn.active { background: var(--forest); color: var(--canvas); }

  .stats-row { display: flex; gap: 8px; padding: 14px 0 16px; }
  .stat-chip { flex: 1; background: rgba(243,239,227,0.08); border: 1px solid rgba(243,239,227,0.25); border-radius: 3px; padding: 8px 8px; font-family: 'IBM Plex Mono', monospace; text-align: left; }
  .stat-chip .n { font-size: 19px; font-weight: 600; display: block; line-height: 1.1; }
  .stat-chip .l { font-size: 9.5px; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-chip.warn .n { color: var(--amber); }
  .stat-chip.bad .n { color: #E9A79B; }
  .stat-chip.clickable { position: relative; }
  .stat-chip.active-filter { background: rgba(243,239,227,0.22); border-color: var(--khaki); }

  .section { padding: 16px 20px 4px; }
  .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--forest-light); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--khaki); opacity: 0.5; }
  .section-label .clear-filter { font-size: 10px; color: var(--red); text-decoration: underline; text-transform: none; cursor: pointer; flex: none; }

  /* Scanner */
  .scan-panel { background: var(--ink); border-radius: 4px; padding: 12px; position: relative; }
  #reader { width: 100%; border-radius: 3px; overflow: hidden; }
  .scan-idle { aspect-ratio: 5/2; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--canvas-dark); gap: 8px; }
  .scan-idle p { margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; opacity: 0.6; text-align: center; padding: 0 24px; }
  .scan-btn-row { display: flex; gap: 8px; margin-top: 8px; }

  .btn-primary { background: var(--forest); color: var(--canvas); font-weight: 700; font-size: 14px; padding: 12px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.03em; font-family: 'Oswald', sans-serif; flex: 1; }
  .btn-primary.small { padding: 9px; font-size: 12.5px; }
  .btn-stop { background: var(--red) !important; }
  .btn-secondary { background: transparent; border: 1.5px solid var(--forest); color: var(--forest); font-weight: 600; font-size: 13px; padding: 10px; border-radius: 3px; flex: 1; }
  .btn-block { width: 100%; margin-top: 8px; }

  /* Category chips */
  .chip-row { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; -ms-overflow-style: none; scrollbar-width: none; }
  .chip-row::-webkit-scrollbar { display: none; }
  .cat-chip { flex-shrink: 0; padding: 7px 13px; border-radius: 20px; background: #FBF9F2; border: 1px solid var(--khaki); font-size: 12.5px; font-weight: 600; color: #55503E; white-space: nowrap; }
  .cat-chip.active { background: var(--forest); color: var(--canvas); border-color: var(--forest); }
  .cat-chip.add-chip { background: var(--canvas-dark); color: var(--forest); border-style: dashed; }

  .search-box { margin-top: 10px; }
  .search-box input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--khaki); border-radius: 3px; background: #FBF9F2; font-size: 14px; }
  .search-box input:focus { outline: none; border-color: var(--forest); }

  .excel-row { display: flex; gap: 8px; margin-top: 12px; }

  /* Manifest cards */
  .crate { background: #FBF9F2; border: 1px solid var(--khaki); border-radius: 2px; margin-bottom: 10px; position: relative; box-shadow: 2px 2px 0 var(--tab-shadow); }
  .crate::before { content: ''; position: absolute; top: -1px; left: 14px; width: 26px; height: 6px; background: var(--canvas); border-left: 1px solid var(--khaki); border-right: 1px solid var(--khaki); border-bottom: 1px solid var(--khaki); border-radius: 0 0 3px 3px; }
  .crate-body { padding: 13px 14px 12px; }
  .crate-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .crate-name { font-family: 'Oswald', sans-serif; font-size: 15.5px; font-weight: 600; margin: 0 0 2px; text-transform: uppercase; cursor: pointer; }
  .crate-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #766A4A; display: flex; gap: 8px; flex-wrap: wrap; }
  .status-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 7px; border-radius: 2px; white-space: nowrap; flex-shrink: 0; }
  .status-ok { background: var(--green-bg); color: var(--green-ok); }
  .status-warn { background: var(--amber-bg); color: var(--amber); }
  .status-bad { background: var(--red-bg); color: var(--red); }
  .camp-ribbon { margin-top: 8px; background: var(--blue-bg); color: var(--blue); font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 6px 9px; border-radius: 3px; }
  .crate-meta { display: flex; gap: 16px; margin-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #55503E; }
  .crate-meta b { color: var(--ink); font-weight: 600; }
  .crate-actions { display: flex; gap: 7px; margin-top: 11px; }
  .qty-btn { flex: 1; background: var(--canvas-dark); border-radius: 3px; padding: 8px 0; font-weight: 700; font-size: 13.5px; color: var(--forest); }
  .icon-btn { background: transparent; color: #9C8E6E; font-size: 11px; font-family: 'IBM Plex Mono', monospace; text-decoration: underline; padding: 8px 6px; }
  .icon-btn.del { color: var(--red); }

  .empty-state { text-align: center; padding: 36px 20px; color: #8B8064; }
  .empty-state p { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; margin: 8px 0 0; line-height: 1.5; }

  /* Pendientes */
  .pend-filters { display: flex; gap: 7px; margin-bottom: 4px; }
  .pend-card { background: #FBF9F2; border: 1px solid var(--khaki); border-left: 4px solid var(--khaki); border-radius: 2px; padding: 12px 14px; margin-bottom: 10px; }
  .pend-card.nuevo { border-left-color: var(--blue); }
  .pend-card.proceso { border-left-color: var(--amber); }
  .pend-card.cerrado { border-left-color: var(--green-ok); opacity: 0.7; }
  .pend-top { display: flex; justify-content: space-between; gap: 10px; }
  .pend-title { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600; margin: 0; text-transform: uppercase; cursor: pointer; }
  .pend-desc { font-size: 13px; color: #55503E; margin: 6px 0 0; line-height: 1.4; }
  .pend-meta { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #8B8064; margin-top: 8px; }
  .estado-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 2px; white-space: nowrap; cursor: pointer; }
  .estado-nuevo { background: var(--blue-bg); color: var(--blue); }
  .estado-proceso { background: var(--amber-bg); color: var(--amber); }
  .estado-cerrado { background: var(--green-bg); color: var(--green-ok); }
  .pend-actions { display: flex; gap: 7px; margin-top: 10px; }

  /* Modal / overlay */
  .overlay { position: fixed; inset: 0; background: rgba(35,41,31,0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .overlay.top-align { align-items: stretch; }
  .modal { background: var(--canvas); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 10px 10px 0 0; padding: 20px 20px 26px; border-top: 3px solid var(--forest); max-height: 92vh; overflow-y: auto; }
  .modal.full { border-radius: 0; max-height: 100vh; min-height: 100vh; padding-top: 16px; }
  .modal h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 18px; margin: 0 0 3px; }
  .modal .sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #766A4A; margin: 0 0 14px; }
  .modal-close { position: absolute; right: 18px; top: 16px; font-size: 20px; color: #766A4A; background: none; }
  label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--forest-light); margin-bottom: 5px; margin-top: 13px; }
  input, textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--khaki); border-radius: 3px; background: #FBF9F2; font-size: 15px; color: var(--ink); }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, textarea:focus { outline: none; border-color: var(--forest); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-cancel { flex: 1; background: transparent; color: #766A4A; font-weight: 600; padding: 12px; }
  .btn-save { flex: 2; background: var(--forest); color: var(--canvas); font-weight: 700; padding: 12px; border-radius: 3px; font-family: 'Oswald', sans-serif; text-transform: uppercase; }
  .radio-row { display: flex; gap: 8px; margin-top: 6px; }
  .radio-opt { flex: 1; text-align: center; padding: 10px; border: 1.5px solid var(--khaki); border-radius: 3px; font-size: 13px; font-weight: 600; color: #55503E; }
  .radio-opt.active { background: var(--forest); color: var(--canvas); border-color: var(--forest); }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--canvas); padding: 10px 18px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; z-index: 70; opacity: 0; transition: opacity 0.25s; pointer-events: none; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }

  /* Camping builder */
  .camp-trip-card { background: #FBF9F2; border: 1px solid var(--khaki); border-radius: 3px; padding: 12px 14px; margin-bottom: 10px; }
  .camp-trip-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .camp-trip-name { font-family: 'Oswald', sans-serif; font-size: 15px; text-transform: uppercase; margin: 0; }
  .camp-trip-dates { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #766A4A; margin-top: 3px; }
  .camp-active-tag { background: var(--blue); color: var(--canvas); font-size: 10px; font-family: 'IBM Plex Mono', monospace; padding: 2px 7px; border-radius: 2px; text-transform: uppercase; }
  .camp-item-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--canvas-dark); font-size: 13.5px; }
  .camp-item-row:last-child { border-bottom: none; }
  .camp-pick-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--canvas-dark); }
  .camp-pick-info { font-size: 13.5px; }
  .camp-pick-info .n { font-weight: 600; }
  .camp-pick-info .d { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #766A4A; }
  .camp-pick-controls { display: flex; align-items: center; gap: 8px; }
  .stepper-btn { width: 28px; height: 28px; border-radius: 50%; background: var(--canvas-dark); font-weight: 700; color: var(--forest); }
  .stepper-val { font-family: 'IBM Plex Mono', monospace; font-weight: 700; min-width: 20px; text-align: center; }
  .step-nav { display: flex; gap: 8px; margin-top: 18px; }
  .origin-toggle { display: flex; gap: 8px; margin: 10px 0; }
  .origin-btn { flex: 1; padding: 8px; border-radius: 3px; border: 1.5px solid var(--khaki); font-size: 12.5px; font-weight: 600; text-align: center; }
  .origin-btn.active { background: var(--forest); color: var(--canvas); border-color: var(--forest); }
</style>
</head>
<body>
<div id="loginScreen"></div>
<button class="perm-btn" id="permBtn" title="">•</button>

<div class="app" id="app" style="display:none;">

  <header class="top">
    <a href="https://lapringles-dirigentes.github.io/Intranet/" style="color: rgba(243,239,227,0.6); font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-decoration: none; display: inline-block; margin-bottom: 8px;">← IntraPringles</a>
    <div class="header-row">
      <div>
        <p class="eyebrow">Grupo Scout Pringles · Barracas</p>
        <h1 class="title">Stock La Pringles</h1>
      </div>
      <button class="camp-btn" id="campOpenBtn">🎒<span class="camp-badge" id="campBadge" style="display:none;">0</span></button>
    </div>
    <div class="tab-switch">
      <button class="tab-btn active" data-tab="chino">Chino</button>
      <button class="tab-btn" data-tab="panol">Pañol</button>
    </div>
    <div class="stats-row" id="statsRow"></div>
  </header>

  <div id="panolSubNav" style="display:none;">
    <div class="subtab-switch">
      <button class="subtab-btn active" data-sub="stock">Stock</button>
      <button class="subtab-btn" data-sub="pendientes">Pendientes</button>
    </div>
  </div>

  <div id="stockSection">
    <div class="section" id="scanSection">
      <p class="section-label">Escanear código</p>
      <div class="scan-panel">
        <div id="reader"></div>
        <div class="scan-idle" id="scanIdle">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#A99A6B" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><line x1="14" y1="14" x2="21" y2="14"/><line x1="14" y1="21" x2="21" y2="21"/><line x1="14" y1="14" x2="14" y2="21"/><line x1="21" y1="14" x2="21" y2="21"/></svg>
          <p>Apuntá la cámara al código de barras</p>
        </div>
        <div class="scan-btn-row">
          <button class="btn-primary" id="scanToggleBtn">Iniciar escaneo</button>
          <button class="btn-secondary" id="manualBtn">Cargar manual</button>
        </div>
      </div>
    </div>

    <div class="section" id="toolsSection">
      <p class="section-label" id="catLabel">Categorías</p>
      <div class="chip-row" id="catChips"></div>
      <div class="search-box"><input type="text" id="searchInput" placeholder="Buscar produ
